# Schema migrations for Postgres (Supabase). SQLite dev/test databases use create_all instead.
#   alembic upgrade head                                  # apply (the API and seed.load also do this on start)
#   alembic revision --autogenerate -m "add fact.x"       # after changing ellis/db.py; review the script
[alembic]
script_location = %(here)s/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
