[project]
name = "ellis-backend"
version = "0.1.0"
description = "Ellis Case API, rules engine, staff agents and voice liaison (Phase 1 MVP)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "argon2-cffi>=23.1",
  "cryptography>=42",
  "reportlab>=4.2",
  "pypdf>=4.3",
  "pillow>=10.4",
  "httpx>=0.27",
  "websockets>=13",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
line = ["cartesia-line>=0.2.19"]
dev = ["pytest>=8", "pytest-cov>=5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ellis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
