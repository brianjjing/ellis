stop_repeat:
  locked: false
  text: Aceasta este o întrebare pentru un specialist autorizat; nu pot răspunde la ea. Vă pot ajuta în schimb cu restul cererii.
secure_entry_repeat:
  locked: true
  text: Pentru siguranța dumneavoastră, vă rog să nu spuneți acel număr cu voce tare. Vă rog să îl tastați pe ecran.
tool_failure:
  locked: false
