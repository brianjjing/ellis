version: ka-draft-1
reviewed: false
disclosure:
  locked: true
  text: გამარჯობა, მე ვარ Ellis, ხელოვნური ინტელექტის ასისტენტი, რომელიც მუშაობს {clinic_name}-თან. მე არ ვარ ადვოკატი და არ შემიძლია იურიდიული რჩევის მოცემა. გეხმარებით მოქალაქეობის განაცხადის მომზადებაში; თქვენ ყველაფერს ამოწმებთ და ხელს აწერთ, ჩვენ კი არასდროს ვაგზავნით განაცხადს თქვენ ნაცვლად. ჩვენ ვინახავთ ამ საუბრის ტექსტს და არა აუდიოს. ეთანხმებით, რომ გავაგრძელოთ?
stop:
  locked: true
  text: გმადლობთ, რომ მითხარით. ეს საკითხი ლიცენზირებულმა საიმიგრაციო სპეციალისტმა უნდა განიხილოს, სანამ განაცხადს შეიტანთ. თქვენი კლინიკა ამის შესახებ დაგიკავშირდებათ. ამ საკითხზე რჩევას ვერ მოგცემთ. გსურთ, სხვა ნაწილით გავაგრძელოთ?
stop_repeat:
  locked: false
  text: ეს კითხვა ლიცენზირებული სპეციალისტისთვისაა; მე მასზე პასუხს ვერ გაგცემთ. სამაგიეროდ, შემიძლია დაგეხმაროთ განაცხადის დანარჩენ ნაწილში.
secure_entry_repeat:
  locked: true
  text: თქვენი უსაფრთხოებისთვის, გთხოვთ, ეს ნომერი ხმამაღლა ნუ თქვით. გთხოვთ, აკრიფოთ ეკრანზე.
