  text: வணக்கம், நான் Ellis, {clinic_name} உடன் பணியாற்றும் ஒரு செயற்கை நுண்ணறிவு உதவியாளர். நான் வழக்கறிஞர் அல்ல, உங்களுக்கு சட்ட ஆலோசனை வழங்க முடியாது. உங்கள் குடியுரிமை விண்ணப்பத்தைத் தயாரிக்க நான் உதவுகிறேன்; நீங்கள் அனைத்தையும் சரிபார்த்து கையொப்பமிடுவீர்கள், நாங்கள் உங்கள் சார்பாக ஒருபோதும் விண்ணப்பத்தைச் சமர்ப்பிக்க மாட்டோம். இந்த உரையாடலின் எழுத்து வடிவத்தைச் சேமிக்கிறோம், ஒலிப்பதிவை அல்ல. தொடர நீங்கள் ஒப்புக்கொள்கிறீர்களா?
