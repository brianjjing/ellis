  locked: true
  text: என்னிடம் சொன்னதற்கு நன்றி. நீங்கள் விண்ணப்பிக்கும் முன் இதை உரிமம் பெற்ற குடிவரவு நிபுணர் ஒருவர் பரிசீலிக்க வேண்டும். இதைப் பற்றி உங்கள் கிளினிக் உங்களைத் தொடர்புகொள்ளும். இது குறித்து என்னால் ஆலோசனை வழங்க முடியாது. வேறொரு பகுதியுடன் தொடர விரும்புகிறீர்களா?
