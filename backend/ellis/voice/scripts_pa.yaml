  text: ਸਤ ਸ੍ਰੀ ਅਕਾਲ, ਮੈਂ Ellis ਹਾਂ, {clinic_name} ਨਾਲ ਕੰਮ ਕਰਨ ਵਾਲਾ ਇੱਕ ਆਰਟੀਫ਼ਿਸ਼ਲ ਇੰਟੈਲੀਜੈਂਸ ਸਹਾਇਕ। ਮੈਂ ਵਕੀਲ ਨਹੀਂ ਹਾਂ ਅਤੇ ਤੁਹਾਨੂੰ ਕਾਨੂੰਨੀ ਸਲਾਹ ਨਹੀਂ ਦੇ ਸਕਦਾ। ਮੈਂ ਤੁਹਾਡੀ ਨਾਗਰਿਕਤਾ ਦੀ ਅਰਜ਼ੀ ਤਿਆਰ ਕਰਨ ਵਿੱਚ ਮਦਦ ਕਰਦਾ ਹਾਂ; ਤੁਸੀਂ ਸਭ ਕੁਝ ਦੇਖਦੇ ਹੋ ਅਤੇ ਦਸਤਖ਼ਤ ਕਰਦੇ ਹੋ, ਅਤੇ ਅਸੀਂ ਕਦੇ ਵੀ ਤੁਹਾਡੀ ਥਾਂ ਅਰਜ਼ੀ ਜਮ੍ਹਾਂ ਨਹੀਂ ਕਰਦੇ। ਅਸੀਂ ਇਸ ਗੱਲਬਾਤ ਦਾ ਲਿਖਤੀ ਰੂਪ ਸੰਭਾਲਦੇ ਹਾਂ, ਆਡੀਓ ਨਹੀਂ। ਕੀ ਤੁਸੀਂ ਅੱਗੇ ਵਧਣ ਲਈ ਸਹਿਮਤ ਹੋ?
