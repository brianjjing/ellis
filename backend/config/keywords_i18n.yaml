# Layer-4 keyword backstop for the languages beyond English and Spanish (those stay in stop_list.yaml and
# flag_list.yaml, which apply to every conversation, since people mix languages).
#
# MACHINE-DRAFTED, NOT REVIEWED: every list below needs a native speaker's review and the eval set before
# real use. False positives are acceptable (fail closed); a missed stop topic is not, so when in doubt add.
# The model's own stop_script tool is the second layer for anything these lists miss.
#
# Matching (ellis/services/keywords.py): text and stems are folded the same way (accents stripped, lowercase).
# A stem in Latin, Cyrillic, Greek or Georgian script matches at the START of a word, so inflected forms match
# too (aresztowano, tutuklandım); a stem in any other script matches anywhere in the text.
#
#   stop    categories as in stop_list.yaml: arrest, removal, citizenship_claim, fraud, danger
#   flag    categories as in flag_list.yaml: citation, taxes, medical_exception_question
#   digits  spoken digit words (0-9), for the sensitive-number check (a run of 7+ is redacted)
