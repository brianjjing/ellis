# The languages Ellis can talk in: what Cartesia's Sonic TTS speaks (sonic-3.6, 44 languages) and the locales
# (accents) it lists, from docs.cartesia.ai (tts-models/latest, capability-guides/advanced-capabilities), Oct 2026.
# This file is the only language list: the API serves it to the language pickers on both sides.
#
#   name / native  English name (for the model's reply_language and clinic screens) / the language's own name
#   locales        Cartesia locale codes; the first is Ellis's default for the language. A label is shown
#                  only when a language has more than one locale.
#   stt            speech-to-text: ink-2 (turn detection; en es fr hi ja), ink-whisper (no turn detection),
#                  or none (Ellis listens by typing only)
#   rtl            written right to left
#
# Ellis's own screen text exists in English and Spanish; every other language sees English screen text while
# Ellis talks in the chosen language. The fixed legal lines (disclosure, stop, secure entry) for languages other
# than English and Spanish are machine-translated drafts (see voice/scripts_<code>.yaml, reviewed: false).
en: {name: English, native: English, stt: ink-2, locales: [
  {code: en-US, label: United States}, {code: en-GB, label: United Kingdom}, {code: en-CA, label: Canada},
  {code: en-AU, label: Australia}, {code: en-IN, label: India}, {code: en-IE, label: Ireland},
  {code: en-NZ, label: New Zealand}, {code: en-SG, label: Singapore}, {code: en-ZA, label: South Africa}]}
es: {name: Spanish, native: Español, stt: ink-2, locales: [
  {code: es-MX, label: México}, {code: es-US, label: Estados Unidos}, {code: es-ES, label: España}]}
fr: {name: French, native: Français, stt: ink-2, locales: [
  {code: fr-FR, label: France}, {code: fr-CA, label: Canada}]}
pt: {name: Portuguese, native: Português, stt: ink-whisper, locales: [
